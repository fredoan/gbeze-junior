  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyBkibp1JxO5TsFPddIPYekZTt7qH0GcjSQ",
      authDomain: "gbeze-junior.firebaseapp.com",
      projectId: "gbeze-junior",
      storageBucket: "gbeze-junior.firebasestorage.app",
      messagingSenderId: "651737929168",
      appId: "1:651737929168:web:cddc3fac5b7ef6c906d5d5"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function load() {
      const container = document.getElementById("articlesContainer");
      container.innerHTML = "Chargement...";
      const q = query(collection(db, "articles"), orderBy("date", "desc"));
      const snap = await getDocs(q);
      container.innerHTML = "";
      snap.forEach(doc => {
        const data = doc.data();
        const date = data.date ? new Date(data.date.seconds * 1000).toLocaleDateString("fr-FR") : "";
        container.innerHTML += `<div class="article-card">
          <span class="tag">${data.type || "annonce"}</span>
          <h2><a href="article.html?id=${doc.id}">${data.titre}</a></h2>
          <p>${data.contenu.substring(0, 200)}…</p>
          ${data.lienVideo ? `<a href="${data.lienVideo}" target="_blank">Voir la vidéo</a>` : ""}
          <small>${date}</small>
        </div>`;
      });
      if (container.innerHTML === "") container.innerHTML = "<p>Aucune actualité pour le moment.</p>";
    }
    load();
  </script>
