<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Administration — GBÈZÉ JUNIOR HOUEGNON</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
  :root {
    --bleu-fonce: #0B1D3A;
    --bleu-mid: #1E3A5F;
    --marron: #8B5A2B;
    --marron-clair: #C69C6D;
    --blanc: #ffffff;
    --off-white: #F5F0E8;
    --light-bg: #E8F0FE;
    --text-dark: #0B1D3A;
    --text-body: #1E3A5F;
    --text-muted: #5A6268;
    --border: rgba(11,29,58,0.14);
    --success: #1a7a3c;
    --danger: #b91c1c;
    --font-display: 'Cinzel Decorative', serif;
    --font-title: 'Cinzel', serif;
    --font-body: 'Raleway', sans-serif;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:var(--font-body); background:var(--off-white); color:var(--text-dark); overflow-x:hidden; }

  #loginScreen {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bleu-fonce);
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,transparent 1px,transparent 44px);
  }
  .login-box {
    background:var(--blanc); width:100%; max-width:420px;
    padding:3rem 2.5rem; border-top:4px solid var(--marron-clair);
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .login-logo { font-family:var(--font-display); font-size:1.8rem; font-weight:900; color:var(--bleu-fonce); text-align:center; }
  .login-logo span { color:var(--marron-clair); }
  .login-sub  { text-align:center; font-size:.7rem; letter-spacing:.22em; text-transform:uppercase; color:var(--text-muted); margin-top:.4rem; margin-bottom:2.2rem; }
  .login-field { margin-bottom:1.2rem; }
  .login-field label { display:block; font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-body); margin-bottom:.45rem; }
  .login-field input { width:100%; padding:.85rem 1rem; border:1.5px solid var(--border); font-family:var(--font-body); font-size:.88rem; color:var(--text-dark); outline:none; transition:border-color .3s; background:var(--blanc); }
  .login-field input:focus { border-color:var(--bleu-fonce); }
  .login-btn { width:100%; padding:.95rem; background:var(--bleu-fonce); color:var(--blanc); border:none; cursor:pointer; font-family:var(--font-title); font-size:.74rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; transition:background .3s; margin-top:.5rem; }
  .login-btn:hover { background:var(--bleu-mid); }
  .login-error { text-align:center; color:var(--danger); font-size:.76rem; margin-top:.8rem; display:none; }

  #adminScreen { display:none; }

  .admin-top {
    background:var(--bleu-fonce); padding:1rem 2rem;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:.8rem;
    position:sticky; top:0; z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
  }
  .admin-brand { font-family:var(--font-display); font-size:1.4rem; font-weight:700; color:var(--blanc); }
  .admin-brand span { color:var(--marron-clair); }
  .admin-top-right { display:flex; align-items:center; gap:.8rem; }
  .admin-site-link { font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.2); padding:.4rem .9rem; transition:all .3s; font-family:var(--font-body); }
  .admin-site-link:hover { color:var(--marron-clair); border-color:var(--marron-clair); }
  .logout-btn { padding:.5rem 1.1rem; border:1.5px solid rgba(255,255,255,.3); background:transparent; color:rgba(255,255,255,.8); cursor:pointer; font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; transition:all .3s; font-family:var(--font-title); }
  .logout-btn:hover { border-color:var(--marron-clair); color:var(--marron-clair); }

  .admin-body {
    max-width:1320px; margin:0 auto; padding:2rem;
    display:grid; grid-template-columns:1fr 380px;
    gap:2rem; align-items:start;
  }

  .card { background:var(--blanc); border:1px solid var(--border); box-shadow:0 2px 12px rgba(11,29,58,.06); }
  .card-header { padding:1.1rem 1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  .card-header h2 { font-family:var(--font-display); font-size:1.35rem; font-weight:700; color:var(--bleu-fonce); }
  .card-badge { padding:.22rem .7rem; background:var(--light-bg); color:var(--bleu-fonce); font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .card-body { padding:1.5rem; }

  .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:.8rem; margin-bottom:0; }
  .stat-box  { background:var(--light-bg); padding:1rem; text-align:center; border:1px solid var(--border); }
  .stat-num  { font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--bleu-fonce); display:block; }
  .stat-lbl  { font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--text-muted); }

  .form-group { margin-bottom:1rem; }
  .form-group label { display:block; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-body); margin-bottom:.4rem; font-family:var(--font-title); }
  .req { color:var(--danger); }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width:100%; padding:.75rem 1rem;
    border:1.5px solid var(--border);
    font-family:var(--font-body); font-size:.85rem;
    color:var(--text-dark); outline:none;
    transition:border-color .3s; background:var(--blanc);
    resize:vertical;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color:var(--bleu-fonce); }
  .form-group select { cursor:pointer; }

  .dynamic-block { margin-bottom:1.2rem; }
  .dynamic-block .block-label { font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-body); margin-bottom:.4rem; }
  .url-hint {
    background:var(--light-bg); border:1px solid var(--border);
    border-left:3px solid var(--marron-clair);
    padding:.8rem 1rem; font-size:.74rem;
    color:var(--text-body); line-height:1.7; margin-bottom:.8rem;
  }
  .url-hint strong { color:var(--bleu-fonce); }
  .item-row { display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem; }
  .item-row input { flex:1; }
  .item-row button { white-space:nowrap; padding:0.5rem 0.8rem; font-size:0.7rem; cursor:pointer; border-radius:4px; font-weight:bold; border:none; }
  .btn-postimage { background:var(--bleu-fonce); color:white; }
  .btn-postimage:hover { background:var(--bleu-mid); }
  .btn-remove { background:var(--danger); color:white; }
  .btn-remove:hover { background:#a31818; }
  .btn-add { background:var(--marron); color:white; font-weight:700; padding:0.6rem 1.2rem; border:none; border-radius:4px; cursor:pointer; font-size:0.75rem; margin-top:0.3rem; font-family:var(--font-body); }
  .btn-add:hover { background:var(--marron-clair); color:var(--bleu-fonce); }

  .tabs { display:flex; }
  .tab-btn { padding:.52rem 1.1rem; border:1.5px solid var(--border); border-bottom:none; background:var(--off-white); cursor:pointer; font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); font-family:var(--font-title); transition:all .2s; }
  .tab-btn.active { background:var(--blanc); color:var(--bleu-fonce); }
  .toolbar { display:flex; gap:.35rem; flex-wrap:wrap; padding:.5rem; border:1.5px solid var(--border); border-bottom:none; background:var(--off-white); }
  .tool-btn { padding:.3rem .65rem; border:1px solid var(--border); background:var(--blanc); cursor:pointer; font-size:.74rem; font-weight:700; color:var(--text-body); transition:all .2s; font-family:var(--font-title); }
  .tool-btn:hover { background:var(--bleu-fonce); color:var(--blanc); border-color:var(--bleu-fonce); }
  #editorArea {
    width:100%; min-height:260px; padding:1rem;
    border:1.5px solid var(--border);
    font-family:var(--font-body); font-size:.87rem;
    line-height:1.85; color:var(--text-dark); outline:none;
    background:var(--blanc);
  }
  #editorArea:empty::before { content:attr(data-ph); color:var(--text-muted); pointer-events:none; }
  #editorArea:focus { border-color:var(--bleu-fonce); }
  #previewPane {
    border:1.5px solid var(--border); padding:1.2rem;
    min-height:260px; background:var(--blanc);
    font-size:.9rem; line-height:1.9; color:var(--text-body);
    display:none;
  }

  .actions { display:flex; gap:.7rem; margin-top:1.4rem; flex-wrap:wrap; }
  .act-btn { padding:.82rem 1.6rem; border:none; cursor:pointer; font-family:var(--font-title); font-size:.7rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; transition:all .3s; }
  .btn-publish { background:var(--bleu-fonce); color:var(--blanc); flex:1; }
  .btn-publish:hover:not(:disabled) { background:var(--bleu-mid); }
  .btn-draft   { background:var(--off-white); color:var(--text-body); border:1.5px solid var(--border); flex:1; }
  .btn-draft:hover   { background:var(--light-bg); border-color:var(--bleu-fonce); }
  .btn-reset   { background:transparent; color:var(--danger); border:1.5px solid rgba(185,28,28,.2); }
  .btn-reset:hover  { background:#fde8e8; }
  .form-msg { margin-top:.8rem; font-size:.76rem; display:none; padding:.6rem 1rem; }
  .form-msg.ok  { background:#e8f8ef; color:var(--success); border-left:3px solid #25D366; }
  .form-msg.err { background:#fde8e8; color:var(--danger); border-left:3px solid var(--danger); }

  .art-list { display:flex; flex-direction:column; gap:.6rem; }
  .art-item { padding:1rem 1.2rem; border:1px solid var(--border); background:var(--blanc); display:flex; align-items:center; gap:1rem; transition:all .25s; }
  .art-item:hover { border-color:rgba(11,29,58,.25); box-shadow:0 4px 16px rgba(11,29,58,.07); }
  .art-thumb { width:58px; height:58px; flex-shrink:0; background:var(--light-bg); display:flex; align-items:center; justify-content:center; font-size:1.6rem; overflow:hidden; }
  .art-thumb img { width:58px; height:58px; object-fit:cover; object-position:top; }
  .art-info { flex:1; min-width:0; }
  .art-info-title { font-size:.84rem; font-weight:700; color:var(--bleu-fonce); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:.25rem; }
  .art-info-meta  { font-size:.66rem; color:var(--text-muted); display:flex; gap:.8rem; flex-wrap:wrap; }
  .status-pub  { padding:.15rem .55rem; font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:#d4f0df; color:var(--success); }
  .status-draft{ padding:.15rem .55rem; font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:#fff3cd; color:#856404; }
  .art-btns { display:flex; gap:.35rem; flex-shrink:0; }
  .mini-btn { padding:.32rem .65rem; border:1px solid var(--border); background:var(--blanc); cursor:pointer; font-size:.64rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-body); transition:all .2s; font-family:var(--font-title); }
  .mini-btn:hover      { background:var(--bleu-fonce); color:var(--blanc); border-color:var(--bleu-fonce); }
  .mini-btn.pub-toggle:hover { background:var(--success); border-color:var(--success); color:var(--blanc); }
  .mini-btn.del:hover  { background:var(--danger); border-color:var(--danger); color:var(--blanc); }

  #toast { position:fixed; bottom:2rem; right:2rem; z-index:9999; padding:1rem 1.5rem; min-width:260px; background:var(--success); color:var(--blanc); font-size:.78rem; font-weight:700; box-shadow:0 8px 30px rgba(0,0,0,.2); transform:translateY(80px); opacity:0; transition:all .35s ease; }
  #toast.show  { transform:translateY(0); opacity:1; }
  #toast.error { background:var(--danger); }

  .mini-spin { width:28px; height:28px; margin:1.5rem auto; border:3px solid var(--border); border-top-color:var(--bleu-fonce); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  @media (max-width:1100px) { .admin-body { grid-template-columns:1fr; } }
  @media (max-width:680px)  {
    .admin-body { padding:1rem; gap:1.2rem; }
    .form-row   { grid-template-columns:1fr; }
    .stats-row  { grid-template-columns:1fr 1fr; }
    .actions    { flex-direction:column; }
    .act-btn    { width:100%; justify-content:center; }
    .card-body  { padding:1rem; }
  }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">GBÈZÉ <span>JUNIOR</span></div>
    <p class="login-sub">Panneau d'administration</p>
    <div class="login-field">
      <label>Identifiant</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="username"/>
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">🔐 Se connecter</button>
    <p class="login-error" id="loginError">Identifiants incorrects. Réessayez.</p>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen">

  <div class="admin-top">
    <div class="admin-brand">GBÈZÉ <span>JUNIOR</span> — Administration</div>
    <div class="admin-top-right">
      <a href="actualites.html" target="_blank" class="admin-site-link">🌐 Voir le site</a>
      <button class="logout-btn" onclick="doLogout()">🚪 Déconnexion</button>
    </div>
  </div>

  <div class="admin-body">

    <!-- COLONNE GAUCHE : FORMULAIRE -->
    <div>
      <div class="card">
        <div class="card-header">
          <h2 id="formTitle">✏️ Nouvel article</h2>
          <span class="card-badge" id="formMode">CRÉATION</span>
        </div>
        <div class="card-body">

          <div class="form-group">
            <label>Titre <span class="req">*</span></label>
            <input type="text" id="fTitre" placeholder="Titre de l'actualité…"/>
          </div>

          <div class="form-group">
            <label>Type <span class="req">*</span></label>
            <select id="fType">
              <option value="">— Choisir —</option>
              <option value="prestation">Prestation</option>
              <option value="video">Vidéo</option>
              <option value="annonce">Annonce</option>
            </select>
          </div>

          <!-- PHOTOS -->
          <div class="dynamic-block">
            <div class="block-label">🖼️ Photos (URL) — optionnel</div>
            <div id="imagesContainer"></div>
            <button type="button" class="btn-add" id="btnAddImage">➕ Ajouter une photo</button>
          </div>

          <!-- VIDÉOS -->
          <div class="dynamic-block">
            <div class="block-label">🎬 Vidéos (URL) — optionnel</div>
            <div id="videosContainer"></div>
            <button type="button" class="btn-add" id="btnAddVideo">➕ Ajouter une vidéo</button>
          </div>

          <!-- Contenu -->
          <div class="form-group">
            <label>Contenu <span class="req">*</span></label>
            <div class="tabs">
              <button class="tab-btn active" onclick="switchTab('editor',this)">✏️ Éditeur</button>
              <button class="tab-btn"        onclick="switchTab('preview',this)">👁️ Aperçu</button>
            </div>
            <div class="toolbar" id="toolbar">
              <button class="tool-btn" onclick="fmt('bold')"              title="Gras"><b>G</b></button>
              <button class="tool-btn" onclick="fmt('italic')"            title="Italique"><i>I</i></button>
              <button class="tool-btn" onclick="fmt('underline')"         title="Souligné"><u>S</u></button>
              <button class="tool-btn" onclick="fmtBlock('h2')"           >Titre</button>
              <button class="tool-btn" onclick="fmtBlock('h3')"           >Sous-titre</button>
              <button class="tool-btn" onclick="fmt('insertUnorderedList')">• Liste</button>
              <button class="tool-btn" onclick="fmt('insertOrderedList')"  >1. Liste</button>
              <button class="tool-btn" onclick="fmt('removeFormat')"       >✕ Format</button>
            </div>
            <div id="editorArea" contenteditable="true"
                 data-ph="Rédigez votre article ici…"
                 oninput="livePreview()"></div>
            <div id="previewPane"></div>
          </div>

          <div class="actions">
            <button class="act-btn btn-publish" id="btnPublish" onclick="saveArticle(true)">🚀 Publier</button>
            <button class="act-btn btn-draft"   id="btnDraft"   onclick="saveArticle(false)">💾 Brouillon</button>
            <button class="act-btn btn-reset"   onclick="resetForm()">🗑️ Effacer</button>
          </div>
          <div class="form-msg" id="formMsg"></div>

        </div>
      </div>
    </div>

    <!-- COLONNE DROITE : STATS + LISTE -->
    <div style="display:flex;flex-direction:column;gap:1.5rem;">

      <div class="card">
        <div class="card-header"><h2>📊 Statistiques</h2></div>
        <div class="card-body">
          <div class="stats-row">
            <div class="stat-box"><span class="stat-num" id="stTotal">—</span><span class="stat-lbl">Total</span></div>
            <div class="stat-box"><span class="stat-num" id="stPubl">—</span><span class="stat-lbl">Publiés</span></div>
            <div class="stat-box"><span class="stat-num" id="stDraft">—</span><span class="stat-lbl">Brouillons</span></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>📋 Mes articles</h2>
          <button class="mini-btn" onclick="loadList()" style="font-size:.62rem;">🔄 Actualiser</button>
        </div>
        <div class="card-body" style="padding-top:.8rem;">
          <div id="artListWrap">
            <div class="mini-spin"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="toast">✅ Action effectuée</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, updateDoc, deleteDoc,
    doc, getDocs, getDoc, orderBy, query, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBkibp1JxO5TsFPddIPYekZTt7qH0GcjSQ",
    authDomain: "gbeze-junior.firebaseapp.com",
    projectId: "gbeze-junior",
    storageBucket: "gbeze-junior.firebasestorage.app",
    messagingSenderId: "651737929168",
    appId: "1:651737929168:web:cddc3fac5b7ef6c906d5d5"
  };

  const ADMIN_USER = "admin";
  const ADMIN_PASS = "houegnon@fredy2026";

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let editingId = null;

  /* ─── IMAGES & VIDÉOS DYNAMIQUES ─── */
  function createImageRow(url = '') {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" class="image-input" value="${url}" placeholder="https://..." />
      <button type="button" class="btn-remove">🗑️</button>
    `;
    row.querySelector('.btn-remove').addEventListener('click', () => row.remove());
    document.getElementById('imagesContainer').appendChild(row);
  }

  function createVideoRow(url = '') {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" class="video-input" value="${url}" placeholder="https://www.youtube.com/watch?v=..." />
      <button type="button" class="btn-remove">🗑️</button>
    `;
    row.querySelector('.btn-remove').addEventListener('click', () => row.remove());
    document.getElementById('videosContainer').appendChild(row);
  }

  function getArrayFromContainer(containerSelector, inputClass) {
    const inputs = document.querySelectorAll(`${containerSelector} .${inputClass}`);
    return Array.from(inputs).map(inp => inp.value.trim()).filter(v => v && v.startsWith('http'));
  }

  function clearAndFill(containerId, urls, createFn) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if (urls && urls.length > 0) {
      urls.forEach(url => createFn(url));
    }
    if (!urls || urls.length === 0) createFn('');
  }

  document.getElementById('btnAddImage').addEventListener('click', () => createImageRow());
  document.getElementById('btnAddVideo').addEventListener('click', () => createVideoRow());

  // Initialisation
  createImageRow();
  createVideoRow();

  /* ─── LOGIN ─── */
  window.doLogin = () => {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      loadList();
    } else {
      const err = document.getElementById('loginError');
      err.style.display = 'block';
      document.getElementById('loginPass').value = '';
      setTimeout(()=>err.style.display='none', 3000);
    }
  };
  window.doLogout = () => {
    document.getElementById('adminScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginPass').value = '';
    resetForm();
  };

  /* ─── RESET FORMULAIRE ─── */
  window.resetForm = () => {
    editingId = null;
    document.getElementById('fTitre').value = '';
    document.getElementById('fType').value = '';
    document.getElementById('editorArea').innerHTML = '';
    document.getElementById('previewPane').innerHTML = '';
    clearAndFill('imagesContainer', [], createImageRow);
    clearAndFill('videosContainer', [], createVideoRow);
    document.getElementById('formTitle').textContent = '✏️ Nouvel article';
    document.getElementById('formMode').textContent  = 'CRÉATION';
    document.getElementById('formMsg').style.display = 'none';
    setBtns(false);
  };

  /* ─── SAUVEGARDER ─── */
  window.saveArticle = async (publie) => {
    const titre    = document.getElementById('fTitre').value.trim();
    const type     = document.getElementById('fType').value;
    const contenu  = document.getElementById('editorArea').innerHTML.trim();

    if (!titre || !type || !contenu || contenu === '<br>') {
      showMsg('⚠️ Titre, type et contenu sont obligatoires.','err');
      return;
    }

    setBtns(true);
    document.getElementById('btnPublish').textContent = '⏳ En cours…';

    try {
      const images = getArrayFromContainer('#imagesContainer', 'image-input');
      const videos = getArrayFromContainer('#videosContainer', 'video-input');

      const data = {
        titre, type, contenu, publie,
        images,
        videos,
        date:     Timestamp.now(),
        updatedAt:Timestamp.now()
      };

      if (editingId) {
        await updateDoc(doc(db,'articles',editingId), data);
        toast('✅ Article modifié avec succès !');
      } else {
        await addDoc(collection(db,'articles'), data);
        toast(publie ? '🚀 Article publié !' : '💾 Brouillon enregistré !');
      }

      resetForm();
      loadList();
    } catch(e) {
      showMsg('❌ Erreur : ' + e.message, 'err');
      console.error(e);
    } finally {
      setBtns(false);
      document.getElementById('btnPublish').innerHTML = '🚀 Publier';
    }
  };

  /* ─── CHARGER LISTE ─── */
  window.loadList = async () => {
    const wrap = document.getElementById('artListWrap');
    wrap.innerHTML = '<div class="mini-spin"></div>';
    try {
      const q    = query(collection(db,'articles'), orderBy('date','desc'));
      const snap = await getDocs(q);
      const arts = snap.docs.map(d=>({id:d.id,...d.data()}));

      document.getElementById('stTotal').textContent = arts.length;
      document.getElementById('stPubl').textContent  = arts.filter(a=>a.publie).length;
      document.getElementById('stDraft').textContent = arts.filter(a=>!a.publie).length;

      if (!arts.length) {
        wrap.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;font-size:.82rem;">Aucun article encore.</p>';
        return;
      }

      wrap.innerHTML = '<div class="art-list">' + arts.map(a=>{
        const firstImg = (a.images && a.images.length > 0) ? a.images[0] : null;
        const date = a.date?.toDate ? a.date.toDate().toLocaleDateString('fr-FR') : '';
        return `
        <div class="art-item">
          <div class="art-thumb">
            ${firstImg ? `<img src="${firstImg}" alt=""/>` : '📰'}
          </div>
          <div class="art-info">
            <div class="art-info-title">${a.titre}</div>
            <div class="art-info-meta">
              <span>📅 ${date}</span>
              <span>${a.type||''}</span>
              <span class="${a.publie?'status-pub':'status-draft'}">${a.publie?'Publié':'Brouillon'}</span>
            </div>
          </div>
          <div class="art-btns">
            <button class="mini-btn"       onclick="editArticle('${a.id}')">✏️</button>
            <button class="mini-btn pub-toggle" onclick="togglePub('${a.id}',${a.publie})">${a.publie?'🔒':'🌐'}</button>
            <button class="mini-btn del"   onclick="delArticle('${a.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('') + '</div>';
    } catch(e) {
      wrap.innerHTML = '<p style="color:var(--danger);padding:1rem;font-size:.8rem;">⚠️ Erreur de chargement.</p>';
      console.error(e);
    }
  };

  /* ─── ÉDITER ─── */
  window.editArticle = async (id) => {
    try {
      const snap = await getDoc(doc(db,'articles',id));
      if (!snap.exists()) return;
      const a = snap.data();
      editingId = id;
      document.getElementById('fTitre').value       = a.titre     || '';
      document.getElementById('fType').value        = a.type      || '';
      document.getElementById('editorArea').innerHTML = a.contenu  || '';

      const urlsImg = a.images || [];
      clearAndFill('imagesContainer', urlsImg, createImageRow);

      const urlsVid = a.videos || [];
      clearAndFill('videosContainer', urlsVid, createVideoRow);

      document.getElementById('formTitle').textContent = '✏️ Modifier l\'article';
      document.getElementById('formMode').textContent  = 'MODIFICATION';
      window.scrollTo({top:0,behavior:'smooth'});
    } catch(e) { console.error(e); }
  };

  /* ─── TOGGLE PUBLIER ─── */
  window.togglePub = async (id, current) => {
    try {
      await updateDoc(doc(db,'articles',id), { publie:!current });
      toast(!current ? '🌐 Article publié !' : '🔒 Article masqué');
      loadList();
    } catch(e) { console.error(e); }
  };

  /* ─── SUPPRIMER ─── */
  window.delArticle = async (id) => {
    if (!confirm('Supprimer définitivement cet article ?')) return;
    try {
      await deleteDoc(doc(db,'articles',id));
      toast('🗑️ Article supprimé');
      loadList();
    } catch(e) { console.error(e); }
  };

  /* ─── HELPERS ─── */
  function toast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'show' + (type?' '+type:'');
    setTimeout(()=>t.className='', 3200);
  }
  function showMsg(msg, type) {
    const el = document.getElementById('formMsg');
    el.textContent = msg;
    el.className   = 'form-msg ' + type;
    el.style.display = 'block';
  }
  function setBtns(disabled) {
    document.getElementById('btnPublish').disabled = disabled;
    document.getElementById('btnDraft').disabled   = disabled;
  }
</script>

<script>
  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const ed = document.getElementById('editorArea');
    const pv = document.getElementById('previewPane');
    const tb = document.getElementById('toolbar');
    if (tab==='editor') {
      ed.style.display='block'; pv.style.display='none'; tb.style.display='flex'; ed.focus();
    } else {
      livePreview();
      ed.style.display='none'; pv.style.display='block'; tb.style.display='none';
    }
  }
  function livePreview() {
    const c = document.getElementById('editorArea').innerHTML;
    document.getElementById('previewPane').innerHTML = c || '<em style="color:var(--text-muted)">Aperçu vide…</em>';
  }
  function fmt(cmd)      { document.execCommand(cmd,false,null); document.getElementById('editorArea').focus(); }
  function fmtBlock(tag) { document.execCommand('formatBlock',false,'<'+tag+'>'); document.getElementById('editorArea').focus(); }
</script>
</body>
</html>
