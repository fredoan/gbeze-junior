<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration – GBÈZÉ JUNIOR HOUEGNON</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bleu-fonce: #0B1D3A;
      --bleu-mid: #1E3A5F;
      --marron: #8B5A2B;
      --marron-clair: #C69C6D;
      --blanc: #FFFFFF;
      --blanc-casse: #F5F0E8;
      --texte: #0B1D3A;
      --texte-muted: #5A6268;
      --border: rgba(11,29,58,0.15);
      --font-display: 'Cinzel Decorative', serif;
      --font-title: 'Cinzel', serif;
      --font-body: 'Raleway', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--blanc-casse); font-family: var(--font-body); color: var(--texte); line-height: 1.7; }
    a { color: var(--marron); text-decoration: none; }
    a:hover { color: var(--bleu-mid); }
    nav {
      background: var(--bleu-fonce); padding: 0 5%; height: 72px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1); color: white; position: fixed; top:0; left:0; right:0; z-index:1000;
    }
    .nav-logo { font-family: var(--font-display); font-size: .95rem; letter-spacing: .12em; color: white; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-family: var(--font-title); font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,0.8); }
    .nav-links a:hover { color: var(--marron-clair); }
    .container { max-width: 1000px; margin: 100px auto 40px; background: var(--blanc); padding: 30px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    h1, h2 { font-family: var(--font-display); color: var(--bleu-fonce); }
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; display: block; margin-bottom: 5px; color: var(--texte); }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 3px; font-family: inherit; }
    button { background: var(--marron); color: white; border: none; padding: 10px 20px; border-radius: 3px; cursor: pointer; font-family: var(--font-title); text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; }
    button:hover { background: #6b431e; }
    .article-card { border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; border-radius: 3px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
    .hidden { display: none; }
    .error { color: red; }
    footer { background: var(--bleu-fonce); color: white; text-align: center; padding: 20px; margin-top: 50px; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">GBÈZÉ JUNIOR</div>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="actualites.html">Actualités</a></li>
      <li><a href="admin.html" style="color:var(--marron-clair);">Admin</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div id="loginSection" class="container">
    <h1>Connexion administrateur</h1>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="Entrez le mot de passe">
    </div>
    <button onclick="login()">Se connecter</button>
    <p id="loginError" class="error"></p>
  </div>

  <div id="adminPanel" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Gestion des articles</h1>
      <button onclick="logout()">Déconnexion</button>
    </div>
    <button onclick="showAddForm()">+ Nouvel article</button>
    <div id="articleForm" class="hidden" style="margin-top:20px;">
      <h2 id="formTitle">Ajouter un article</h2>
      <input type="hidden" id="docId">
      <div class="form-group"><label>Titre</label><input type="text" id="titre"></div>
      <div class="form-group"><label>Contenu</label><textarea id="contenu" rows="5"></textarea></div>
      <div class="form-group"><label>Lien vidéo (optionnel)</label><input type="text" id="lienVideo"></div>
      <div class="form-group"><label>Type</label><select id="type"><option value="prestation">Prestation</option><option value="video">Vidéo</option><option value="annonce">Annonce</option></select></div>
      <button onclick="saveArticle()">Enregistrer</button>
      <button onclick="cancelEdit()" style="background:#888;">Annuler</button>
    </div>
    <hr style="margin:20px 0;">
    <h2>Articles existants</h2>
    <div id="articlesList"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkibp1JxO5TsFPddIPYekZTt7qH0GcjSQ",
      authDomain: "gbeze-junior.firebaseapp.com",
      projectId: "gbeze-junior",
      storageBucket: "gbeze-junior.firebasestorage.app",
      messagingSenderId: "651737929168",
      appId: "1:651737929168:web:cddc3fac5b7ef6c906d5d5"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PASSWORD = "houegnon@fredy2026";

    window.login = function() {
      const pwd = document.getElementById("password").value;
      if (pwd === ADMIN_PASSWORD) {
        sessionStorage.setItem("adminAuth", "true");
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadArticles();
      } else {
        document.getElementById("loginError").textContent = "Mot de passe incorrect.";
      }
    };

    window.logout = function() {
      sessionStorage.removeItem("adminAuth");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("adminPanel").classList.add("hidden");
    };

    window.showAddForm = function() {
      document.getElementById("articleForm").classList.remove("hidden");
      document.getElementById("formTitle").textContent = "Ajouter un article";
      document.getElementById("docId").value = "";
      document.getElementById("titre").value = "";
      document.getElementById("contenu").value = "";
      document.getElementById("lienVideo").value = "";
      document.getElementById("type").value = "annonce";
    };

    window.cancelEdit = function() {
      document.getElementById("articleForm").classList.add("hidden");
    };

    window.saveArticle = async function() {
      const docId = document.getElementById("docId").value;
      const titre = document.getElementById("titre").value.trim();
      const contenu = document.getElementById("contenu").value.trim();
      const lienVideo = document.getElementById("lienVideo").value.trim();
      const type = document.getElementById("type").value;
      if (!titre || !contenu) return alert("Titre et contenu obligatoires.");
      const data = { titre, contenu, lienVideo, type, date: serverTimestamp() };
      try {
        if (docId) {
          await updateDoc(doc(db, "articles", docId), data);
        } else {
          await addDoc(collection(db, "articles"), data);
        }
        cancelEdit();
        loadArticles();
      } catch (e) { alert("Erreur : " + e.message); }
    };

    window.editArticle = function(id, article) {
      document.getElementById("articleForm").classList.remove("hidden");
      document.getElementById("formTitle").textContent = "Modifier l'article";
      document.getElementById("docId").value = id;
      document.getElementById("titre").value = article.titre;
      document.getElementById("contenu").value = article.contenu;
      document.getElementById("lienVideo").value = article.lienVideo || "";
      document.getElementById("type").value = article.type || "annonce";
    };

    window.deleteArticle = async function(id) {
      if (confirm("Supprimer cet article ?")) {
        await deleteDoc(doc(db, "articles", id));
        loadArticles();
      }
    };

    async function loadArticles() {
      const list = document.getElementById("articlesList");
      list.innerHTML = "Chargement...";
      const q = query(collection(db, "articles"), orderBy("date", "desc"));
      const snap = await getDocs(q);
      list.innerHTML = "";
      snap.forEach(d => {
        const art = d.data();
        const card = document.createElement("div");
        card.className = "article-card";
        card.innerHTML = `<div><strong>${art.titre}</strong> (${art.type})</div>
          <div>
            <button onclick='editArticle("${d.id}", ${JSON.stringify(art)})'>Modifier</button>
            <button onclick='deleteArticle("${d.id}")' style="background:#a00;">Supprimer</button>
          </div>`;
        list.appendChild(card);
      });
      if (list.innerHTML === "") list.innerHTML = "Aucun article.";
    }

    if (sessionStorage.getItem("adminAuth") === "true") {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
      loadArticles();
    }
  </script>
</body>
</html>
